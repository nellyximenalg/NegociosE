<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia — Mi perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="inicio.html#inicio" class="logo"><svg class="logo-flower" width="16" height="16" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="9" r="6" fill="var(--dahlia)"/><circle cx="23" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="23" r="6" fill="var(--dahlia)"/><circle cx="9" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="16" r="4.5" fill="var(--bg)"/></svg>DAHLIA</a>
      <nav class="nav-links" id="navLinks">
        <a href="inicio.html#inicio">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="inicio.html#nosotros">Nosotros</a>
        <a href="inicio.html#contacto">Contacto</a>
        <a href="login.html" id="navAuthLink">Iniciar sesión</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" id="cartBtn" aria-label="Ver carrito">🛍 Carrito (0)</button>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="section placeholder-section">
    <div class="wrap">
      <span class="eyebrow">Tu perfil</span>
      <h2 class="placeholder-title" id="profileGreeting">Hola</h2>
      <p class="placeholder-text" id="profileEmailText">Cargando tu información...</p>

      <div class="profile-sections">
        <div class="profile-card">
          <h4>Mis datos</h4>
          <p id="profileDataText">—</p>
        </div>
        <div class="profile-card">
          <h4>Mis compras</h4>
          <p>Próximamente vas a poder ver aquí el historial de tus pedidos.</p>
        </div>
      </div>

      <button class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
    </div>
  </section>

  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
    const loggedIn = isLoggedIn();
    const savedEmail = localStorage.getItem('dahlia_user_email') || '';
    const rawName = getDisplayName();
    const displayName = loggedIn ? (rawName === 'Invitada/o' ? 'Cliente Dahlia' : rawName) : 'Invitada/o';

    document.getElementById('profileGreeting').textContent = loggedIn ? `Hola, ${displayName}` : 'No hay sesión activa';
    document.getElementById('profileEmailText').textContent = loggedIn
      ? (savedEmail ? `Sesión iniciada como: ${savedEmail}` : 'Sesión iniciada (sin correo registrado).')
      : 'Inicia sesión para ver tu perfil.';
    document.getElementById('profileDataText').textContent = loggedIn
      ? `Nombre: ${displayName} · Correo: ${savedEmail || 'No proporcionado'}`
      : 'Sin datos todavía.';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('dahlia_logged_in');
      localStorage.removeItem('dahlia_user_email');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
