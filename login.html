<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="auth-split">
    <div class="auth-panel">
      <svg class="auth-doodle auth-doodle--tl" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="40" cy="26" r="16" fill="var(--dahlia)"/><circle cx="60" cy="42" r="16" fill="var(--gold)"/><circle cx="40" cy="58" r="16" fill="var(--dahlia)"/><circle cx="20" cy="42" r="16" fill="var(--gold)"/><circle cx="40" cy="42" r="12" fill="var(--bg)"/>
      </svg>

      <div class="wrap">
        <a href="index.html" class="landing-logo auth-logo">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="9" r="6" fill="var(--dahlia)"/><circle cx="23" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="23" r="6" fill="var(--dahlia)"/><circle cx="9" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="16" r="4.5" fill="var(--bg)"/></svg>
          <span>DAHLIA</span>
        </a>

        <div class="auth-tabs">
          <button type="button" id="tabLogin" class="auth-tab active">Iniciar sesión</button>
          <button type="button" id="tabSignup" class="auth-tab">Crear cuenta</button>
        </div>

        <form class="auth-card auth-form active" id="loginForm">
          <div class="login-field">
            <label for="loginEmail">Correo</label>
            <div class="input-icon-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
              <input type="text" id="loginEmail" placeholder="tu@correo.com">
            </div>
          </div>
          <div class="login-field">
            <label for="loginPassword">Contraseña</label>
            <div class="input-icon-wrap has-toggle">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="loginPassword" placeholder="••••••••">
              <button type="button" class="input-toggle" data-toggle="loginPassword" aria-label="Mostrar contraseña">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <div class="login-extra-row">
            <label class="checkbox-field"><input type="checkbox"> Recordarme</label>
            <a href="#" class="link-muted">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn btn-primary login-submit">Entrar <span class="arrow">→</span></button>
        </form>

        <form class="auth-card auth-form" id="signupForm">
          <div class="login-field">
            <label for="signupName">Nombre</label>
            <div class="input-icon-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="signupName" placeholder="Tu nombre">
            </div>
          </div>
          <div class="login-field">
            <label for="signupEmail">Correo</label>
            <div class="input-icon-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
              <input type="text" id="signupEmail" placeholder="tu@correo.com">
            </div>
          </div>
          <div class="login-field">
            <label for="signupPassword">Contraseña</label>
            <div class="input-icon-wrap has-toggle">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signupPassword" placeholder="••••••••">
              <button type="button" class="input-toggle" data-toggle="signupPassword" aria-label="Mostrar contraseña">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary login-submit">Crear cuenta <span class="arrow">→</span></button>
          <p class="contact-msg" id="signupMsg" hidden></p>
        </form>

        <a href="index.html" class="auth-back">← Volver al inicio</a>
      </div>
    </div>

    <div class="auth-visual">
      <img src="img/landing.png" alt="Dahlia — flores, bolsa de compras y prendas colgadas" class="auth-photo">
      <svg class="auth-doodle auth-doodle--br" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="40" cy="26" r="16" fill="var(--dahlia)"/><circle cx="60" cy="42" r="16" fill="var(--gold)"/><circle cx="40" cy="58" r="16" fill="var(--dahlia)"/><circle cx="20" cy="42" r="16" fill="var(--gold)"/><circle cx="40" cy="42" r="12" fill="var(--bg)"/>
      </svg>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
