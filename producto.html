<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia — Producto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="inicio.html#inicio" class="logo"><svg class="logo-flower" width="16" height="16" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="9" r="6" fill="var(--dahlia)"/><circle cx="23" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="23" r="6" fill="var(--dahlia)"/><circle cx="9" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="16" r="4.5" fill="var(--bg)"/></svg>DAHLIA</a>
      <nav class="nav-links" id="navLinks">
        <a href="inicio.html#inicio">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="inicio.html#nosotros">Nosotros</a>
        <a href="inicio.html#contacto">Contacto</a>
        <a href="login.html" id="navAuthLink">Iniciar sesión</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" id="cartBtn" aria-label="Ver carrito">🛍 Carrito (0)</button>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="section product-detail">
    <div class="wrap">
      <a href="catalogo.html" class="btn btn-ghost back-btn">← Regresar al catálogo</a>

      <div class="product-detail-grid" id="productRoot">
        <div class="prod-image product-detail-image" id="productImage"></div>
        <div class="product-detail-info">
          <span class="prod-sku" id="productSku"></span>
          <h1 class="product-detail-name" id="productName"></h1>
          <div class="product-detail-price" id="productPrice"></div>
          <p class="product-detail-desc" id="productDesc"></p>

          <div class="option-group">
            <span class="option-label">Talla</span>
            <div class="option-pills" id="sizeOptions"></div>
          </div>

          <div class="option-group">
            <span class="option-label">Color <span id="selectedColorName" class="option-selected-name"></span></span>
            <div class="option-swatches" id="colorOptions"></div>
          </div>

          <button class="btn btn-primary product-add-btn" id="addToCartBtn">Agregar al carrito</button>
          <p class="contact-msg" id="productMsg" hidden></p>
        </div>
      </div>
    </div>
  </section>

  <script src="auth.js"></script>
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script src="producto.js"></script>
</body>
</html>
