<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia — Producto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="inicio.html#inicio" class="logo"><svg class="logo-flower" width="16" height="16" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="9" r="6" fill="var(--dahlia)"/><circle cx="23" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="23" r="6" fill="var(--dahlia)"/><circle cx="9" cy="16" r="6" fill="var(--gold)"/><circle cx="16" cy="16" r="4.5" fill="var(--bg)"/></svg>DAHLIA</a>
      <nav class="nav-links" id="navLinks">
        <a href="inicio.html#inicio">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="inicio.html#nosotros">Nosotros</a>
        <a href="inicio.html#contacto">Contacto</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" id="navAuthLink" class="icon-btn" aria-label="Iniciar sesión" title="Iniciar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <button class="cart-btn icon-btn" id="cartBtn" aria-label="Ver carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="section product-detail">
    <div class="wrap">
      <div class="product-detail-grid" id="productRoot">
        <div class="product-gallery">
          <a href="catalogo.html" class="btn btn-ghost back-btn">← Regresar al catálogo</a>
          <div class="prod-image product-detail-image" id="productImage"></div>
          <div class="gallery-thumbs" id="productThumbs"></div>
        </div>
        <div class="product-detail-info">
          <span class="prod-sku" id="productSku"></span>
          <h1 class="product-detail-name" id="productName"></h1>
          <div class="product-detail-price" id="productPrice"></div>
          <p class="price-per-unit" id="pricePerUnit" hidden></p>
          <p class="product-detail-desc" id="productDesc"></p>

          <div class="option-group">
            <span class="option-label">Talla <span id="selectedSizeName" class="option-selected-name"></span></span>
            <div class="option-pills" id="sizeOptions"></div>
            <div class="size-measurements" id="sizeMeasurements" hidden></div>
          </div>

          <div class="option-group">
            <span class="option-label">Color <span id="selectedColorName" class="option-selected-name"></span></span>
            <div class="option-swatches" id="colorOptions"></div>
            <p class="color-note" id="colorNote"></p>
          </div>

          <div class="add-to-cart-row">
            <div class="qty-stepper">
              <button type="button" class="qty-btn" id="qtyMinus" aria-label="Restar cantidad">−</button>
              <input type="number" class="qty-input" id="qtyInput" value="1" min="1" max="20" inputmode="numeric">
              <button type="button" class="qty-btn" id="qtyPlus" aria-label="Sumar cantidad">+</button>
            </div>
            <button class="btn btn-primary product-add-btn" id="addToCartBtn">Agregar al carrito</button>
          </div>
          <p class="contact-msg" id="productMsg" hidden></p>

          <div class="product-details-block">
            <h3>Detalles del producto</h3>
            <ul class="product-details-list" id="productDetailsList"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="auth.js"></script>
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script src="producto.js"></script>
</body>
</html>
